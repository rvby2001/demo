dialogues:
  nexus_lounge:
    start_node: "node_0"
    nodes:
      node_0:
        speaker: "narrator"
        text: "The neon signs outside flickered, casting a warm purple glow across the lounge."
        next: "node_1"
      node_1:
        speaker: "narrator"
        text: "Inside, the sound of rhythmic clicking and keyboard taps filled the air."
        next: "node_2"
      node_2:
        speaker: "maya"
        text: "Yes! Got him! Finally, that boss is down! My hands are literally shaking!"
        next: "node_3"
      node_3:
        speaker: "yuki"
        text: "Quiet down, Maya! I'm trying to focus here... I'm right in the middle of a very emotional cutscene."
        next: "node_4"
      node_4:
        speaker: "maya"
        text: "Oh come on, Yuki! You've been playing that cozy walking simulator for hours. You need some real action!"
        next: "node_5"
      node_5:
        speaker: "yuki"
        text: "It's not a walking simulator, it's an interactive narrative masterpiece! It has layers!"
        next: "node_6"
      node_6:
        speaker: "maya"
        text: "Layers? The only layers I care about are the layers of armor on bosses I need to shred."
        next: "node_7"
      node_7:
        speaker: "yuki"
        text: "Sigh... you just don't appreciate the art of slow-paced storytelling, do you?"
        next: "node_8"
      node_8:
        speaker: "maya"
        text: "Hey, I appreciate stories! But I want to feel the adrenaline. Like in roguelikes. If you don't fight for it, does it even matter?"
        next: "node_9"
      node_9:
        speaker: "yuki"
        text: "Of course it does. A good story makes you think, makes you feel. It sticks with you long after you turn off the screen."
        next: "node_10"
      node_10:
        speaker: "maya"
        text: "Well, beating a boss after fifty tries sticks with me too! Mostly in my wrists, but still."
        next: "node_11"
      node_11:
        speaker: "yuki"
        text: "Speaking of fifty tries, did you see the esports tournament yesterday? That grand final was insane."
        next: "node_12"
      node_12:
        speaker: "maya"
        text: "Oh! The tactical shooter finals? Yes! That 1v3 clutch at the end was legendary. I was screaming!"
        next: "node_13"
      node_13:
        speaker: "yuki"
        text: "See? Even you appreciate the tension. But for me, the tension comes from character development."
        next: "node_14"
      node_14:
        speaker: "maya"
        text: "Alright, let's settle this. Leo's sitting right there. Hey Leo! Which side are you on? Gameplay or story?"
        next: "node_15"
      node_15:
        speaker: "narrator"
        text: "Both Maya and Yuki look toward you, waiting for your response."
        choices:
          - text: "Gameplay is king. Give me high stakes and action!"
            next: "node_16_gameplay"
          - text: "Story is everything. I want a narrative that moves me."
            next: "node_16_story"

      # Gameplay Branch
      node_16_gameplay:
        speaker: "maya"
        text: "Ha! I knew you'd get it, Leo! Adrenaline is the lifeblood of gaming."
        next: "node_17_gameplay"
      node_17_gameplay:
        speaker: "yuki"
        text: "I suppose I can't blame you two. Action is immediate. But it can feel a bit mindless sometimes."
        next: "node_18_gameplay"
      node_18_gameplay:
        speaker: "maya"
        text: "Mindless? Fighting Malenia in Elden Ring requires split-second reflexes and perfect build knowledge! It's practically high-speed chess."
        next: "node_19_gameplay"
      node_19_gameplay:
        speaker: "yuki"
        text: "True, but does it make you question the nature of existence? Like Outer Wilds does?"
        next: "node_20_gameplay"
      node_20_gameplay:
        speaker: "maya"
        text: "Outer Wilds is cool, but have you seen Cyberpunk: Edgerunners? It has both! High-octane action and it rips your heart out."
        next: "node_21_gameplay"
      node_21_gameplay:
        speaker: "yuki"
        text: "Oh... Edgerunners. Okay, you got me there. That show was a masterpiece."
        next: "node_22_gameplay"
      node_22_gameplay:
        speaker: "maya"
        text: "Right?! The animation by Studio Trigger was so kinetic. The fights made my heart race, but that ending..."
        next: "node_23_gameplay"
      node_23_gameplay:
        speaker: "yuki"
        text: "That ending was devastating. I listened to 'I Really Want to Stay at Your House' on repeat for a week."
        next: "node_24_gameplay"
      node_24_gameplay:
        speaker: "maya"
        text: "We all did, Yuki. We all did. It showed how a high-action setting can still deliver a massive emotional punch."
        next: "node_25_gameplay"
      node_25_gameplay:
        speaker: "yuki"
        text: "And it felt very much like playing a high-stakes game where every choice is life-or-death."
        next: "node_26_gameplay"
      node_26_gameplay:
        speaker: "maya"
        text: "Exactly! That's the gameplay spirit. You feel the physical threat."
        next: "node_27_gameplay"
      node_27_gameplay:
        speaker: "narrator"
        text: "Yuki smiles, conceding the point for now as she closes her laptop."
        next: "node_28"

      # Story Branch
      node_16_story:
        speaker: "yuki"
        text: "Yes! Thank you, Leo! A game without a good story is just a series of inputs."
        next: "node_17_story"
      node_17_story:
        speaker: "maya"
        text: "A series of inputs? Those inputs are an art form, Yuki! The muscle memory, the flow state..."
        next: "node_18_story"
      node_18_story:
        speaker: "yuki"
        text: "I understand the flow state, Maya. But think about Disco Elysium. The writing, the internal monologues... it's pure literature."
        next: "node_19_story"
      node_19_story:
        speaker: "maya"
        text: "Disco Elysium is great, but I get bored if I'm just reading text for hours. I need to dodge roll!"
        next: "node_20_story"
      node_20_story:
        speaker: "yuki"
        text: "Fair enough. But a slow pace allows for deeper emotions. Just like in anime. Have you watched Frieren: Beyond Journey's End?"
        next: "node_21_story"
      node_21_story:
        speaker: "maya"
        text: "Oh! Frieren! Yes, I actually did watch that. It was... surprisingly comfy."
        next: "node_22_story"
      node_22_story:
        speaker: "yuki"
        text: "Comfy? It's a beautiful meditation on time, friendship, and grief! The way it starts after the hero's quest is so unique."
        next: "node_23_story"
      node_23_story:
        speaker: "maya"
        text: "Yeah, I liked how it didn't rush. And honestly, the magic battles when they did happen were top-tier animated."
        next: "node_24_story"
      node_24_story:
        speaker: "yuki"
        text: "Exactly. The action feels earned because you care so deeply about the characters."
        next: "node_25_story"
      node_25_story:
        speaker: "maya"
        text: "True. When Fern and Stark fought, I was cheering because of their growth, not just the flashy spells."
        next: "node_26_story"
      node_26_story:
        speaker: "yuki"
        text: "See? The narrative makes the action better. That's the power of good story pacing."
        next: "node_27_story"
      node_27_story:
        speaker: "narrator"
        text: "Maya nods, appreciating the depth of Yuki's perspective."
        next: "node_28"

      # Merge Path
      node_28:
        speaker: "yuki"
        text: "So, speaking of shows, what are we watching tonight? I think we both need a break from gaming."
        next: "node_29"
      node_29:
        speaker: "maya"
        text: "I was thinking we could check out Dungeon Meshi! Delicious in Dungeon. Have you started it?"
        next: "node_30"
      node_30:
        speaker: "yuki"
        text: "Oh, I've been reading the manga for years! The anime adaptation by Trigger is incredible."
        next: "node_31"
      node_31:
        speaker: "maya"
        text: "It's so good! It perfectly captures that tabletop RPG feel. Going down into the dungeon, managing resources..."
        next: "node_32"
      node_32:
        speaker: "yuki"
        text: "And cooking the monsters! Honestly, the recipes actually look delicious, which is a bit concerning."
        next: "node_33"
      node_33:
        speaker: "maya"
        text: "Right? I never thought I'd want to eat a Giant Bat or a Walking Mushroom, but Laios makes it look so gourmet!"
        next: "node_34"
      node_34:
        speaker: "yuki"
        text: "What's great about it is how detailed the ecology is. It treats the dungeon like a real, living ecosystem."
        next: "node_35"
      node_35:
        speaker: "maya"
        text: "Yes! It's not just 'here are monsters to fight.' It's 'how do these monsters survive, and what do they taste like?'"
        next: "node_36"
      node_36:
        speaker: "yuki"
        text: "And the characters are so lovable. Senshi is basically the ultimate dad of the party."
        next: "node_37"
      node_37:
        speaker: "maya"
        text: "Senshi is a legend! His obsession with balanced diets in a deadly dungeon is hilarious."
        next: "node_38"
      node_38:
        speaker: "yuki"
        text: "It really highlights how tabletop gaming influences modern fantasy stories. The rules of the dungeon are so concrete."
        next: "node_39"
      node_39:
        speaker: "maya"
        text: "Speaking of tabletop, we really need to get a campaign going. Or at least play a co-op RPG."
        next: "node_40"
      node_40:
        speaker: "yuki"
        text: "Like Baldur's Gate 3? I still haven't finished my second playthrough. I got distracted by custom mods."
        next: "node_41"
      node_41:
        speaker: "maya"
        text: "A second playthrough? I'm on my fourth! I made a chaotic evil bard this time. It's hilarious."
        next: "node_42"
      node_42:
        speaker: "yuki"
        text: "A chaotic evil bard sounds like a nightmare to party with."
        next: "node_43"
      node_43:
        speaker: "maya"
        text: "It is! I keep failing my performance checks and starting tavern brawls."
        next: "node_44"
      node_44:
        speaker: "yuki"
        text: "Well, maybe we should play something a bit more cooperative. Like It Takes Two?"
        next: "node_45"
      node_45:
        speaker: "maya"
        text: "Ooh, It Takes Two is amazing! The gameplay styles change in every single level. It's brilliant design."
        next: "node_46"
      node_46:
        speaker: "yuki"
        text: "Agreed. It really merges mechanics and story. The gameplay reflects the characters' relationship struggles."
        next: "node_47"
      node_47:
        speaker: "maya"
        text: "Look at us, finding common ground. Story and gameplay working together in harmony."
        next: "node_48"
      node_48:
        speaker: "yuki"
        text: "Who would have thought? We're a perfect gaming team, Maya."
        next: "node_49"
      node_49:
        speaker: "narrator"
        text: "The night grew deeper as the rain began to tap gently against the lounge window."
        next: "node_50"
      node_50:
        speaker: "narrator"
        text: "With their gaming debate settled, the two friends fired up their console, ready for another adventure."
        next: "node_51"
      node_51:
        speaker: "narrator"
        text: "Thank you for playing Cyber Nexus! Your choices shaped their late-night lounge discussion."
        next: null
